name: Rebuild data.js

# Full-resolution originals aren't committed, so this job can't resize
# anything — it rebuilds data.js from the web copies you pushed, and picks up
# new music and notes. Resizing happens on your machine when you run the build
# before pushing.
on:
  push:
    paths:
      - 'images/_web/**'
      - 'music/**'
      - 'notes/**'
      - 'build.mjs'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # sharp isn't needed here (nothing to resize), so this stays fast.
      - name: Generate data.js
        run: node build.mjs

      - name: Commit if anything changed
        run: |
          if [[ -z "$(git status --porcelain data.js images/_web)" ]]; then
            echo "nothing to do — data.js and web images already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js images/_web
          git commit -m "Rebuild data.js and web-sized images"
          git push
